name: Build the Linux executable

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

# Writing release assets is the only privilege needed.
permissions:
  contents: write

jobs:
  linux-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Setup Python ${{ env.PYTHON_VERSION }} Environment
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 'Install the system libraries Qt needs to start on a bare runner'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 fonts-dejavu-core

    - name: 'Install PhotoSheet and PyInstaller'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install . pyinstaller

    - name: 'Use PyInstaller to build the executable'
      shell: bash
      run: ./.github/build.sh

    - name: 'Smoke test the executable'
      shell: bash
      run: ./dist/photosheet-v* --version

    - name: 'Self-test the executable (every layout, colour management, PDF export, the window)'
      shell: bash
      run: |
        QT_QPA_PLATFORM=offscreen ./dist/photosheet-v* --self-test selftest.txt || { cat selftest.txt || true; exit 1; }
        cat selftest.txt

    - name: 'Upload the self-test report'
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: selftest-linux
        path: selftest.txt
        if-no-files-found: ignore

    - name: 'Upload artifacts'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: photosheet-linux
        path: dist/

    - name: 'Extract tag message'
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        : > /tmp/release_body.md
        if git tag -l "$GITHUB_REF_NAME" | grep -q .; then
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/release_body.md
        fi

    - name: 'Automatic release'
      if: startsWith(github.ref, 'refs/tags/')
      uses: "softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228" # v3.0.2
      with:
        token: "${{ secrets.GITHUB_TOKEN }}"
        body_path: /tmp/release_body.md
        files: |
          dist/photosheet-v*
