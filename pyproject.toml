[project]
name = "photosheet"
dynamic = ["version"]
description = "Print many photos per sheet: passport photos, contact sheets, strips and more. Python + Qt."
requires-python = ">=3.10"
dependencies = ["PySide6", "Pillow", "numpy", "rich"]

[project.scripts]
photosheet = "photosheet.__main__:main"
photosheet-cli = "photosheet.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "photosheet.__version__"}

# The package folder is src/ itself; it is imported as "photosheet".
[tool.setuptools]
packages = ["photosheet", "photosheet.core", "photosheet.ui", "photosheet.icons"]

[tool.setuptools.package-dir]
photosheet = "src"

[tool.setuptools.package-data]
"photosheet.icons" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
